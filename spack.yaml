# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-esm1p5]
  - _version: [2024.12.1]
  # _spack-version and _custom-scopes inform the branch of spack to use, and custom scopes if applicable, respectively
  - _spack-version: ["1.1"]
  - _custom-scopes: ["ukmo-restricted-scope"]
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: ["cice4", "um7", "mom5", "oasis3-mct"]
  - _injection: ["openmpi"]
  specs:
  - access-esm1p5
  packages:
    # Direct ACCESS-NRI dependencies
    # Note: some packages have branch-specific logic and hence can't use
    # the usual '@git.DATE' calver (https://calver.org) format, instead
    # requiring a `@git.DATE=BRANCH` version.
    mom5:
      require:
      # Refer to https://github.com/ACCESS-NRI/access-spack-packages/pull/443
      # The version access-esm1.5 is only available in access-spack-packages
      # versions older than 2026.08.000.
      - '@git.access-esm1.5-2025.03.002=access-esm1.5'
    cice4:
      require:
      - '@git.access-esm1.5-2025.04.001=access-esm1.5'
    um7:
      require:
      - '@git.2024.10.17=access-esm1.5'
    # Lower-level ACCESS-NRI dependencies
    gcom4:
      require:
      - '@git.2024.05.28=access-esm1.5'
    oasis3-mct:
      require:
      - '@git.access-esm1.5_2024.05.24=access-esm1.5'
    # Other dependencies
    openmpi:
      require:
      - '@4.0.2'
    netcdf-c:
      require:
      - '@4.7.4'
    netcdf-fortran:
      require:
      - '@4.5.2'
    hdf5:
      require:
      - '@1.10.11'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@19.0.3.199
    cxx:
      require:
      - intel-oneapi-compilers-classic@19.0.3.199
    fortran:
      require:
      - intel-oneapi-compilers-classic@19.0.3.199

    # Preferences for all packages
    all:
      prefer:
      - 'target=x86_64_v4'
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.02.002
      destination: $env/.package_repos/access-spack-packages
